<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Fuzhou Mahjong for CS375 by Bill Liu, Zhixian Li, and Sunny Liu." />
        <title>CS375 Mahjong</title>
    </head>
    <body>
        <main>
            <header>
                <h1>CS375 Mahjong</h1>
                <p>Fuzhou Mahjong · Web development course project</p>
            </header>
            <p class="round-summary" role="status"></p>
            <p class="seat-summary"></p>
            <canvas id="game" width="384" height="216" aria-label="Mahjong table">
                This game requires a browser that supports HTML Canvas.
            </canvas>
            <!-- The lobby is drawn on the canvas; these inputs only receive its typing. -->
            <div class="visually-hidden">
                <label for="player-name">Your name</label>
                <input id="player-name" autocomplete="nickname" />
                <label for="room-code">Room code</label>
                <input id="room-code" autocomplete="off" />
            </div>
            <section class="round-result" aria-label="Round result" hidden>
                <h2 class="score-heading"></h2>
                <p class="score-breakdown"></p>
                <p class="winning-hand"></p>
                <p class="score-save-status" role="status"></p>
                <button type="button" class="check-score" hidden>Check save status</button>
            </section>
            <section class="game-controls" aria-label="Game controls" hidden>
                <p class="selected-tile" role="status"></p>
                <div class="action-buttons">
                    <button type="button" data-action="drawFront">Draw front</button>
                    <button type="button" data-action="drawBack">Draw back</button>
                    <button type="button" data-action="discard">Discard</button>
                    <button type="button" data-action="claim">Claim</button>
                    <button type="button" data-action="pass">Pass</button>
                </div>
                <p class="action-status" role="status"></p>
            </section>
            <p class="status" role="status"></p>
            <p class="connection-status" role="status"></p>
            <div class="round-details"></div>
            <section class="leaderboard" aria-label="High scores">
                <h2>High scores</h2>
                <div class="action-buttons">
                    <button type="button" data-period="daily" aria-pressed="true">Daily</button>
                    <button type="button" data-period="weekly" aria-pressed="false">Weekly</button>
                    <button type="button" class="refresh-leaderboard">Refresh</button>
                </div>
                <p>Calendar days and Monday-start weeks · America/New_York</p>
                <p class="leaderboard-status" role="status"></p>
                <table>
                    <thead><tr><th scope="col">Rank</th><th scope="col">Player</th><th scope="col">Score</th></tr></thead>
                    <tbody></tbody>
                </table>
            </section>
        </main>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
